# /etc/nginx/sites-available/kiraayasense — installed by deploy/bootstrap.sh.
# Certbot adds the 443 server block and the HTTP->HTTPS redirect.
server {
    listen 80;
    server_name kiraayasense.com www.kiraayasense.com;

    # Review videos can be up to 200 MB (app/api/uploads/local/route.ts).
    client_max_body_size 210m;

    # Review photos and videos written at runtime. `next start` only serves
    # files that existed at build time, so nginx serves these directly.
    # Payment proofs live in storage/private and are never exposed here.
    location /uploads/ {
        alias /home/kiraaya/app/public/uploads/;
        add_header X-Content-Type-Options nosniff;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
